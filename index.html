
<!DOCTYPE html>
<html>
<head>
  <title>zheng chicken games</title>

  <style>
    body {
      background-image: url("https://tse2.mm.bing.net/th/id/OIP.4-wFSIchMcFQ0Q329ecDPgHaFF?rs=1&pid=ImgDetMain&o=7&rm=3");
      background-size: cover;
      background-position: center;
      font-family: Arial;
      text-align: center;
      color: white;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, 200px);
      gap: 20px;
      justify-content: center;
      padding: 40px;
    }

    .game-card {
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      box-shadow: 0 0 10px #000;
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: scale(1.05);
    }

    .game-card img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>zheng chicken games</h1>

<div class="game-grid">

  <Sushi Party) 
  <a class="game-card" href="https://www.sushiparty.io/" target="_blank">
    <img src="https://th.bing.com/th/id/ODF.XSiJq0AUOLRqeT4JaVlhLA?w=32&h=32&qlt=91&pcl=fffffa&o=6&pid=1.2">
    <p>Sushi Party</p>
  </a>

</div>

</body>
</html>
